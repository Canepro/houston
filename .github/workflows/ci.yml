name: tests

on:
  push:
  pull_request:

# One run per ref. Without this, a push on top of a push leaves the first run
# grinding through a 7-minute suite nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only. The default token is read-write on `push`, and nothing here needs to
# write anything.
permissions:
  contents: read

jobs:
  # The whole gate: the suite needs nothing but Node.
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # BOTH majors, every run. Node 22 is EOL 2027-04-30, so 24 is the floor; 26 is
        # what the floor will become. The one class of dependency that cannot span the
        # two is a native addon compiled against one ABI -- which is why
        # `enableScripts: false` is set in `.yarnrc.yml` and why this matrix is the
        # thing that would have caught it.
        node-version: ["24", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # `packageManager` in package.json pins yarn EXACTLY, and corepack is what
      # honours it. Installing yarn any other way makes that pin decorative. Node 26 no
      # longer ships corepack (24 still does), so it is installed from npm first; on 24
      # that replaces the bundled copy with the same tool.
      - run: npm install -g corepack && corepack enable
      # --immutable: the lockfile is the input, not a suggestion. A resolution that
      # differs from yarn.lock fails here rather than silently testing other versions.
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn typecheck
      # `--ci` is the mode the zero-skips reporter enforces in: a skipped, todo or `.only` test,
      # or an authored skip construct with no reviewed reason, fails the run. GitHub sets CI
      # anyway, which Jest reads as the same flag; saying it keeps the gate independent of that.
      - run: yarn test --ci
      # THE LAYER GATE, and then the proof that it has a bulb. `dependency-cruiser`
      # tryImports `typescript`; when that does not take it falls back to a non-TS
      # parser, finds nothing, and reports a clean tree. The self-test plants a cycle
      # and a seam bypass, asserts both are REPORTED, and removes them -- so a gate
      # that has gone blind fails the build instead of passing it.
      - run: yarn depcruise
      - run: yarn depcruise:selftest
