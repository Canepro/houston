# node-modules, not PnP. This tree is CommonJS with `tsc` emit and no bundler, and
# PnP resolves through a loader that `tsc`, jest and dependency-cruiser each have to
# be taught about separately. A real node_modules is what all three already expect.
nodeLinker: node-modules

# Nothing here phones home.
enableTelemetry: false

# `fs-ext` was the only build-script dependency this tree considered, and it is
# ruled out: it ships no prebuilt binary, so it compiles against the ABI of
# whichever Node installed it and cannot serve the Node 24 + 26 matrix from one
# node_modules. Nothing left needs to run a postinstall, so nothing may.
enableScripts: false
