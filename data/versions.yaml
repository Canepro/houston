# Rocket.Chat -> MongoDB fallback map for houston.
#
# PRIMARY resolution is a live lookup against releases.rocket.chat/<v>/info
# (see src/lib/versions.ts). This file is only the OFFLINE FALLBACK, used when that
# endpoint is unreachable, or for old releases that predate its
# `compatibleMongoVersions` field.
#
# `supports` lists every MongoDB a range runs on, where its note states them: an upgrade keeps
# a MongoDB the target still runs on rather than demanding a major move. Absent means the
# paired `mongo` alone.
#
# Only the MongoDB *tag* is stored per RC range; flavor / shell / oplog are
# derived in code (src/lib/versions.ts) from the RC and Mongo majors:
#   - mongo_flavor = "official" if MONGO major >= 8 else "bitnami-legacy"
#   - mongo_shell  = "mongosh"  if Mongo major >= 5 else "mongo"  (official only)
#   - oplog        = RC major < 8  (MONGO_OPLOG_URL; deprecated in 8.x)
#
# Constraints are version specifiers such as >=7.0,<8 (comma = AND); first match wins, newest first.

default_rc_image: registry.rocket.chat/rocketchat/rocket.chat

rules:
  - rc: ">=8.2.0"
    mongo: "8.0"
    note: "RC 8.2+ -> MongoDB 8.0 (per releases.rocket.chat)."
  - rc: ">=8.0.0,<8.2.0"
    mongo: "8.2"
    note: "RC 8.0/8.1 -> MongoDB 8.2 (per releases.rocket.chat)."
  - rc: ">=7.13.0,<8.0.0"
    mongo: "8.0"
    note: "RC 7.13 adds MongoDB 8 (5/6/7/8 per releases.rocket.chat); 8.0 chosen, as online."
    supports: ["5.0", "6.0", "7.0", "8.0"]
  - rc: ">=7.0.0,<8.0.0"
    mongo: "7.0"
    note: "RC 7.x supports 5.0/6.0/7.0; 7.0 chosen."
    supports: ["5.0", "6.0", "7.0"]
  - rc: ">=6.0.0,<7.0.0"
    mongo: "6.0"
    note: "RC 6.x supports 4.4/5.0/6.0; 6.0 recommended."
    supports: ["4.4", "5.0", "6.0"]
  - rc: ">=5.0.0,<6.0.0"
    mongo: "5.0"
    note: "RC 5.x supports 4.2/4.4/5.0."
    supports: ["4.2", "4.4", "5.0"]
  - rc: ">=4.0.0,<5.0.0"
    mongo: "4.4"
    note: "RC 4.x supports 3.6-4.4; needs MONGO_OPLOG_URL."
    supports: ["3.6", "4.0", "4.2", "4.4"]
  - rc: ">=3.0.0,<4.0.0"
    mongo: "4.0"
    note: "RC 3.x supports 3.4-4.0; needs MONGO_OPLOG_URL."
    supports: ["3.4", "3.6", "4.0"]
  - rc: "<3.0.0"
    mongo: "3.6"
    note: "Legacy RC (<3.0); best-effort."
