# AmazonEKSAdminPolicy covers everything INSIDE a namespace. houston also reads a
# handful of cluster-scoped resources before it creates a workspace -- StorageClasses
# above all, because that is how it knows whether the volume can bind. Read-only:
# an engineer can see how the cluster is built and cannot change it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: houston-cluster-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  # A namespace per workspace is the whole model, and a namespace is cluster-scoped,
  # so AmazonEKSAdminPolicy -- which is admin INSIDE a namespace -- cannot make one.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csidrivers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: houston-cluster-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: houston-cluster-reader
subjects:
  - kind: Group
    name: houston-engineers        # the group the EKS access entry puts them in
    apiGroup: rbac.authorization.k8s.io
